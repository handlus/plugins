name: windows-recording
on:
  workflow_dispatch:
    inputs:
      scripts:
        description: JSON list of test scripts under tests/windows
        default: '["spike.ps1","e2e.ps1"]'
  push:
    branches: [windows-support]
    paths: ['tests/windows/**', 'plugins/handlus/skills/recording-chrome-fake-cursor/**', '.github/workflows/windows-recording.yml']
jobs:
  run:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
        script: ${{ fromJSON(inputs.scripts || '["spike.ps1","e2e.ps1"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: ${{ matrix.script }}
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests/windows/${{ matrix.script }}
      - name: same take from Git Bash (Claude Code's shell on Windows)
        if: always() && matrix.script == 'e2e.ps1'
        shell: bash
        run: bash tests/windows/gitbash.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: out-${{ matrix.os }}-${{ matrix.script }}
          path: out/
